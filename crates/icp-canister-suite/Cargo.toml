[package]
name = "icp-canister-suite"
version = "0.1.0"
edition = "2021"

[dependencies]
domain = { workspace = true }
settlement-engine = { workspace = true }
finality-authority = { workspace = true }
policy-engine = { workspace = true }
identity-registry = { workspace = true }
position-ledger = { workspace = true }
asset-ledger = { workspace = true }
protocol-coordinator = { workspace = true }
candid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
